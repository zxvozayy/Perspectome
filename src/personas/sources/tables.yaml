# Published Türkiye figures used to attach lifestyle/context features to personas.
#
#   verified: true  -> read in the primary source (bulletin, API, report PDF).
#   verified: false -> taken from news reports of an official release (several
#                      outlets agree) or a secondary source. Usable as a prior for
