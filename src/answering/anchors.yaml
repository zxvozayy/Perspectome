# Anchor items: WVS-7 answers that may reach the simulation (they are not held-out).
#
# Answers to these items describe what people in a cell actually think; the
# answering layer puts a cell's typical answers to the anchors most related to
# a new question into the prompt, and learns per question which persona fields
# matter (src/answering). Wording and options are from the WVS-7 codebook
# (Variables report v6.0); every item has 2,000+ valid answers in the Türkiye file.
#
# exclude: anchors that are near-duplicates of a held-out item. When that
# held-out item is the probe's target, they never reach the prompt, so accuracy
# isn't measured on an item the prompt has nearly answered already.

