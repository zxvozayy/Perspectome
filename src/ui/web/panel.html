<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Analiz — Perspectome</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/site.css?v=22">
<link rel="stylesheet" href="/static/panel.css?v=22">
<script>try { var t = localStorage.getItem("pt-app-theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}</script>
</head>
<body class="panel-page">
<div class="app">
  <aside class="side" id="side" aria-label="Menü">
    <div class="side__head">
      <a class="logo" href="/"><svg class="logo__mark" viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="2" width="9" height="9" rx="3"/><rect x="13" y="2" width="9" height="9" rx="4.5"/><rect x="2" y="13" width="9" height="9" rx="4.5"/><rect class="dim" x="13" y="13" width="9" height="9" rx="3"/></svg><span><b>Perspectome</b><small>Analiz paneli</small></span></a>
      <button class="icon-btn side-close" type="button" aria-label="Menüyü kapat"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button>
    </div>
    <nav class="side__nav">
      <button class="nav-item" type="button" id="home"><svg class="nav-ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"/></svg>Panel</button>
      <button class="nav-item" type="button" id="new"><svg class="nav-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Yeni sohbet</button>

      <h2 class="side__label">Sohbetler</h2>
      <ul class="history" id="history"></ul>

      <h2 class="side__label">Hazır sorular</h2>
      <ul class="history" id="ready"></ul>
    </nav>
    <div class="side__foot">
      {{badge}}
      <a class="nav-item" href="/cikis"><svg class="nav-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h4a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-4M10 16l-4-4 4-4M6 12h10"/></svg>Çıkış</a>
    </div>
  </aside>
  <div class="scrim" hidden></div>

  <div class="main">
    <header class="topbar">
      <button class="icon-btn side-open" type="button" aria-controls="side" aria-expanded="false" aria-label="Menü"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <nav class="crumbs" aria-label="Konum"><span>Panel</span><span class="crumbs__cur" id="crumb" hidden></span></nav>
      <div class="topbar__end">
        <button class="icon-btn theme-toggle" type="button" aria-label="Temayı değiştir" title="Tema"><svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg><svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg></button>
        <span class="avatar" title="Hesap: {{user}}" aria-label="Hesap: {{user}}">{{initial}}</span>
      </div>
    </header>

    <div class="page-head" id="head"></div>
    <div class="thread" id="thread" aria-live="polite"></div>

    <div class="composer">
      <form id="ask">
        <span class="composer__tag" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 19V9M10 19V5M15 19v-7M20 19v-4"/></svg>Hazır çalıştırmalar</span>
        <label class="sr" for="q">Soru</label>
        <input id="q" name="q" autocomplete="off" maxlength="500" placeholder="Bir senaryo hakkında sor…">
        <button type="submit" aria-label="Sor"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button>
      </form>
      <p>Yanıtlar hazır çalıştırmalardan gelir; yeni simülasyon başlatmaz.</p>
    </div>
  </div>
</div>
<script src="/static/site.js?v=22" defer></script>
<script src="/static/panel.js?v=22" defer></script>
</body>
</html>
