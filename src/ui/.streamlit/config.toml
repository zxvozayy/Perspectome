# Night-sea theme; see theme.py for the full token set.
[theme]
base = "dark"
backgroundColor = "#050A12"
secondaryBackgroundColor = "#0E1E32"
textColor = "#EAF2F8"
primaryColor = "#55C7FF"
borderColor = "#1E3148"
font = "Instrument Sans:https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&display=swap"
baseFontSize = 14
baseRadius = "medium"

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"

[server]
address = "localhost"
headless = true
