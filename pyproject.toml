[project]
name = "perspectome"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
llm = ["openai>=1.0", "anthropic>=0.40"]
db = ["psycopg[binary]>=3.1"]
ml = ["scikit-learn>=1.4"]

[project.scripts]
perspectome-sim = "src.simulation.runner:main"

[tool.pytest.ini_options]
pythonpath = ["."]
